<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e27">
    <title>Light a Jyothi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <!-- UI Layer -->
    <div class="ui-layer">
        <!-- Initial Screen -->
        <div class="screen initial-screen" id="initialScreen">
            <div class="content-wrapper">
                <div class="header-section">
                    <p class="subtitle">Let there be light</p>
                    <h1 class="title">Light a Jyothi</h1>
                </div>
                
                <div class="cta-section">
                    <button class="btn btn-primary" id="lightBtn" aria-label="Light the diya">
                        <span class="btn-inner">
                            <span class="btn-text">Begin</span>
                            <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20">
                                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/>
                                <circle cx="12" cy="12" r="3" fill="currentColor"/>
                            </svg>
                        </span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Experience Screen -->
        <div class="screen experience-screen" id="experienceScreen">
            <div class="message-container" id="messageContainer">
                <p class="experience-message">In light, we find unity</p>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div class="loading" id="loading">
            <div class="loading-dot"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
